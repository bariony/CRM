<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CRM</title>
<meta name="theme-color" content="#0e1113">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CRM">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: single-column phone app. Sticky top bar, one scrolling view at a time, fixed bottom tab bar. Dark graphite first, light as the alternate. */
:root{
  --bg:#0e1113; --surface:#151a1d; --surface2:#1c2226; --line:#262e33;
  --fg:#e8edef; --muted:#8a979f; --pos:#3ddc97; --neg:#ff6b6b; --warn:#f2b84b;
  --accent:#3ddc97; --accent-fg:#052619; --track:#232b30;
  --font-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --font-body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f2f5f6; --surface:#ffffff; --surface2:#e9eef0; --line:#d9e0e3;
    --fg:#13181b; --muted:#5b6770; --pos:#0c9a62; --neg:#d23f3f; --warn:#a96f00;
    --accent:#0c9a62; --accent-fg:#ffffff; --track:#dfe6e9; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f2f5f6; --surface:#ffffff; --surface2:#e9eef0; --line:#d9e0e3;
  --fg:#13181b; --muted:#5b6770; --pos:#0c9a62; --neg:#d23f3f; --warn:#a96f00;
  --accent:#0c9a62; --accent-fg:#ffffff; --track:#dfe6e9; color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:15px; line-height:1.4;
  padding-block:0; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); background:var(--bg); z-index:10}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.top{position:sticky; top:env(safe-area-inset-top, 0px); z-index:9; background:var(--bg); display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0 10px; max-width:560px; margin:0 auto; border-bottom:1px solid var(--line)}
.brand{font-family:var(--font-display); font-weight:700; font-size:17px; letter-spacing:-.01em}
.badge{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted)}
.badge i{width:7px; height:7px; border-radius:50%; background:var(--muted); display:inline-block}
.badge.cloud,.badge.saving,.badge.load{display:none}
.badge.cloud i{background:var(--pos)} .badge.saving i{background:var(--warn)} .badge.error i{background:var(--neg)}
main{max-width:560px; margin:0 auto; padding:16px 0 110px; min-width:0}
h1{font-family:var(--font-display); font-weight:700; font-size:22px; letter-spacing:-.02em; margin:0 0 14px}
h2{font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 10px}
.sec{padding:18px 0; border-top:1px solid var(--line)} .sec:first-child{border-top:0; padding-top:4px}
.muted{color:var(--muted)} .pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}
.num{font-variant-numeric:tabular-nums; font-family:var(--font-display); letter-spacing:-.01em}
.hero{display:flex; flex-direction:column; gap:2px}
.hero .big{font-family:var(--font-display); font-weight:700; font-size:44px; letter-spacing:-.03em; line-height:1.05; font-variant-numeric:tabular-nums}
.hero .lab{color:var(--muted); font-size:13px}
.stats{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-top:16px}
.stat .v{font-family:var(--font-display); font-weight:700; font-size:17px; font-variant-numeric:tabular-nums; overflow-wrap:anywhere}
.stat .k{font-size:12px; color:var(--muted)}
.seg{display:flex; gap:4px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:3px}
.seg button{flex:1; border:0; background:transparent; padding:9px 6px; border-radius:9px; color:var(--muted); font-weight:600; min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface2); color:var(--fg)}
.field{display:flex; flex-direction:column; gap:7px; margin-bottom:16px; min-width:0}
.field>label,.lab-s{font-size:13px; font-weight:600; color:var(--muted)}
.hint{font-size:13px; color:var(--muted); min-height:18px}
.stepper{display:grid; grid-template-columns:64px minmax(0,1fr) 64px; gap:8px}
.step{border:1px solid var(--line); background:var(--surface); border-radius:12px; font-size:26px; min-height:56px}
.step:active{background:var(--surface2)}
textarea{width:100%; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; font-size:14px; min-width:0; resize:vertical}
input[type=text],input[type=date],input:not([type]),select{width:100%; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:0 14px; min-height:52px; font-size:17px; min-width:0}
.stepper input{text-align:center; font-family:var(--font-display); font-weight:700; font-size:28px}
.money{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:0 14px}
.money span{color:var(--muted); font-weight:600}
.money input{border:0; background:transparent; padding:0; min-height:52px; font-size:20px; font-weight:600; flex:1; min-width:0}
.money input:focus-visible{outline:0}
.money:focus-within{outline:2px solid var(--accent); outline-offset:2px}
details summary{cursor:pointer; color:var(--muted); font-weight:600; font-size:13px; padding:4px 0 12px; list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"+ "}
details[open] summary::before{content:"− "}
.btn{display:flex; width:100%; align-items:center; justify-content:center; gap:8px; min-height:54px; border-radius:14px; border:1px solid var(--line); background:var(--surface); font-weight:700; font-size:16px; padding:0 16px}
.btn.primary{background:var(--accent); color:var(--accent-fg); border-color:transparent}
.btn.primary:disabled{opacity:.45}
.btn.ghost{background:transparent; margin-top:10px}
.btn.small{min-height:40px; font-size:14px; width:auto; border-radius:10px}
.list{display:flex; flex-direction:column}
.item{display:flex; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid var(--line); align-items:flex-start}
.item:first-child{border-top:0}
.item .l,.item .r{min-width:0; display:flex; flex-direction:column; gap:2px}
.item .r{align-items:flex-end; text-align:right; flex-shrink:0}
.item b{font-weight:600}
.item .sub{font-size:13px; color:var(--muted); overflow-wrap:anywhere}
.acts{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.kg{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px}
.kc{background:var(--surface2); border:1px solid var(--line); border-radius:12px; padding:12px; min-width:0}
.kc .kh{display:flex; align-items:center; gap:6px; color:var(--muted); font-size:13px; font-weight:600}
.kc .kh svg{width:16px; height:16px}
.kc .ku{font-family:'Bricolage Grotesque',sans-serif; font-size:28px; font-weight:700; line-height:1.15; margin:6px 0 8px}
.kc .ku small{font-family:'Figtree',sans-serif; font-size:13px; font-weight:600; color:var(--muted)}
.kc .kl{display:flex; justify-content:space-between; gap:6px; font-size:13px; padding-top:4px}
.kc .kl span{color:var(--muted)}
.kc.done .ku,.kc.done .kl b{color:var(--pos)}
.pcard{border:1px solid var(--line); border-radius:14px; background:var(--surface); margin-bottom:10px; overflow:hidden}
.ph{display:flex; align-items:center; gap:12px; width:100%; padding:14px; background:none; border:0; text-align:left}
.ph .pl{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px}
.ph .pl b{font-size:17px}
.ph .pr{display:flex; flex-direction:column; align-items:flex-end; gap:2px; text-align:right}
.ph .pn{font-family:var(--font-display); font-size:26px; font-weight:700; line-height:1}
.ph .pn small{font-family:'Figtree',sans-serif; font-size:13px; color:var(--muted); font-weight:600}
.ph>svg{width:18px; height:18px; flex:none; color:var(--muted); transition:transform .15s}
.ph[aria-expanded=true]>svg{transform:rotate(180deg)}
.pdet{padding:0 14px 14px; border-top:1px solid var(--line)}
.dd{position:relative}
.ddb{display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; min-height:52px; padding:0 14px; background:var(--surface); border:1px solid var(--line); border-radius:12px; font-size:17px; text-align:left}
.ddb span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ddb svg{width:18px; height:18px; flex:none; color:var(--muted); transition:transform .15s}
.dd.open .ddb{border-color:var(--accent)}
.dd.open .ddb svg{transform:rotate(180deg)}
.ddl{position:absolute; left:0; right:0; top:calc(100% + 6px); z-index:20; background:var(--surface2); border:1px solid var(--line); border-radius:12px; box-shadow:0 12px 32px rgba(0,0,0,.4); max-height:min(300px,50vh); overflow:auto; padding:4px}
.ddl.up{top:auto; bottom:calc(100% + 6px)}
.ddo{display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; min-height:48px; padding:0 12px; border:0; background:none; border-radius:8px; font-size:16px; text-align:left}
.ddo[aria-selected=true]{color:var(--accent); font-weight:600}
.ddo:active{background:var(--surface)}
.ddo svg{width:18px; height:18px; flex:none}
.need{background:var(--surface2); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin:12px 0}
.need .nl{font-size:13px; color:var(--muted); font-weight:600}
.need .nv{font-family:'Bricolage Grotesque',sans-serif; font-size:30px; font-weight:700; color:var(--pos); line-height:1.15; margin:2px 0 4px}
.need .nv.neg{color:var(--neg)}
.need .nv small{font-family:'Figtree',sans-serif; font-size:13px; font-weight:600; color:var(--muted); margin-left:10px}
.gb.ok{border-color:var(--accent); color:var(--accent)}
.goal{padding:18px 0; border-top:1px solid var(--line)}
.goal:first-of-type{border-top:0; padding-top:2px}
.goal .gh{display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px 12px}
.goal .gt{display:flex; flex-direction:column; gap:6px; min-width:0; flex:1 1 150px}
.goal .gt>b{font-size:16px}
.goal .gmeta{display:flex; align-items:center; flex-wrap:wrap; gap:6px 10px}
.goal .gacts{display:flex; gap:8px; margin-left:auto}
.gb{display:inline-flex; align-items:center; gap:6px; min-height:40px; padding:0 12px; border:1px solid var(--line); background:var(--surface2); color:var(--fg); border-radius:10px; font-weight:600; font-size:14px}
.gb svg{width:16px; height:16px}
.gb:active{background:var(--surface)}
.gb.danger{border-color:var(--neg); color:var(--neg)}
.goal .sub{font-size:13px; color:var(--muted)}
.goal .gleft{font-family:var(--font-display); font-size:24px; font-weight:700; letter-spacing:-.02em; margin-top:10px; font-variant-numeric:tabular-nums}
.res{margin-top:6px}
.charts{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin:16px 0 6px}
.lc{min-width:0; background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden; padding-top:14px}
.ch{display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:4px 8px; padding:0 14px}
.ct{display:flex; flex-direction:column; gap:2px; min-width:0}
.lt{font-size:14px; font-weight:700}
.lsub{font-size:12px; color:var(--muted); overflow-wrap:anywhere}
.lv{font-family:var(--font-display); font-weight:700; font-size:clamp(18px,5.6vw,26px); letter-spacing:-.02em; line-height:1.1; color:var(--pos); font-variant-numeric:tabular-nums; margin-left:auto}
.plot{position:relative; height:112px; margin-top:8px; touch-action:pan-y; cursor:crosshair}
.plot svg{display:block; width:100%; height:100%}
.plot .gl{position:absolute; top:0; bottom:0; width:1px; background:var(--muted); opacity:.4}
.plot .dot{position:absolute; width:11px; height:11px; border-radius:50%; background:var(--accent); border:2px solid var(--surface); transform:translate(-50%,-50%)}
.dayh{display:flex; justify-content:space-between; gap:12px; padding:18px 0 6px; font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.dayh:first-child{padding-top:4px}
.sale{border-top:1px solid var(--line)}
.dayh+.sale{border-top:0}
.srow{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; width:100%; background:none; border:0; padding:12px 0; text-align:left; min-height:56px; color:inherit}
.srow .l,.srow .r{display:flex; flex-direction:column; gap:2px; min-width:0}
.srow .r{align-items:flex-end; text-align:right; flex-shrink:0}
.srow .l b{font-weight:600; overflow-wrap:anywhere}
.srow .sub{font-size:13px; color:var(--muted); overflow-wrap:anywhere}
.det{padding:2px 0 14px}
.sale.open .srow .l b::after{content:" ▴"; color:var(--muted); font-size:11px}
.sale:not(.open) .srow .l b::after{content:" ▾"; color:var(--muted); font-size:11px}
.duo{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px}
.duo .big{font-size:clamp(22px,7.2vw,34px); overflow-wrap:anywhere}
.tbl{margin-top:14px}
.tbl .tr{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,.55fr) minmax(0,1.15fr) minmax(0,1.15fr); gap:8px; padding:10px 0; border-top:1px solid var(--line); font-size:14px; align-items:baseline}
.tbl .tr span{color:var(--muted)}
.tbl .tr b{text-align:right; font-weight:600; font-variant-numeric:tabular-nums; overflow-wrap:anywhere}
.tbl .th{border-top:0; padding:0 0 8px; font-size:12px}
.tbl .th b{color:var(--muted); font-weight:600}
.tbl .done b{color:var(--pos)}
.tbl .tr.meta b{font-family:var(--font-display); font-size:15px}
.pill{display:inline-flex; align-items:center; font-size:12px; font-weight:700; padding:3px 9px; border-radius:99px; background:var(--surface2); color:var(--muted)}
.pill.pos{color:var(--pos)} .pill.warn{color:var(--warn)} .pill.neg{color:var(--neg)}
.bars{display:grid; grid-template-columns:repeat(14,minmax(0,1fr)); gap:4px; align-items:end; height:96px; margin-top:6px}
.bars .c{display:flex; flex-direction:column; justify-content:flex-end; height:100%; background:none; border:0; padding:0; min-width:0; cursor:pointer; color:inherit}
.bars .b{background:var(--track); border-radius:4px 4px 2px 2px; min-height:3px}
.bars .c:hover .b{background:var(--muted)}
.bars .c.sel .b,.bars .c.sel:hover .b{background:var(--accent)}
.chartwrap{position:relative}
.tip{position:absolute; top:-6px; transform:translateY(-100%); background:var(--fg); color:var(--bg); padding:8px 11px; border-radius:10px; font-size:12px; line-height:1.45; white-space:nowrap; pointer-events:none; z-index:5}
.dayinfo{font-size:13px; color:var(--muted); min-height:20px; margin:0 0 10px}
.dayinfo b{color:var(--fg)}
.bars-l{display:grid; grid-template-columns:repeat(14,minmax(0,1fr)); gap:4px; margin-top:6px; font-size:10px; color:var(--muted); text-align:center}
.prog{height:8px; border-radius:99px; background:var(--track); overflow:hidden; margin:8px 0 6px}
.prog i{display:block; height:100%; background:var(--accent); border-radius:99px}
.kv{display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.kv span:first-child{color:var(--muted)}
.kv b{font-variant-numeric:tabular-nums; text-align:right}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chips button{border:1px solid var(--line); background:var(--surface); border-radius:99px; padding:0 14px; min-height:40px; font-weight:600; color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--accent); color:var(--accent-fg); border-color:transparent}
.row2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
.empty{padding:28px 0; text-align:left}
.empty p{color:var(--muted); margin:6px 0 16px; max-width:38ch}
.note{font-size:13px; color:var(--muted); line-height:1.5}
.nav{position:fixed; left:0; right:0; bottom:0; z-index:9; background:var(--bg); border-top:1px solid var(--line); padding:6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px))}
.nav div{max-width:560px; margin:0 auto; display:grid; grid-template-columns:repeat(6,minmax(0,1fr))}
.nav button{background:none; border:0; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0; color:var(--muted); font-size:11px; font-weight:600; min-height:52px}
.nav button svg{width:24px; height:24px}
.nav button[aria-current="page"]{color:var(--accent)}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(84px + env(safe-area-inset-bottom, 0px)); background:var(--fg); color:var(--bg); padding:10px 16px; border-radius:99px; font-weight:600; font-size:14px; z-index:12; max-width:calc(100vw - 32px); text-align:center}
@media (prefers-reduced-motion:no-preference){ .prog i{transition:width .3s ease} }
body.auth .nav{display:none}
input[type=password],input[type=email],input[type=tel]{width:100%; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:0 14px; min-height:52px; font-size:17px; min-width:0}
body{padding-top:env(safe-area-inset-top,0px)}
.hr{display:flex; align-items:center; gap:10px}
.avatar{width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--surface2); color:var(--fg); font-weight:700; font-size:14px; display:grid; place-items:center; padding:0; flex:none}
.avatar[aria-current="page"]{border-color:var(--accent); color:var(--accent)}
.kpis{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.kpi{border:1px solid var(--line); background:var(--surface); border-radius:14px; padding:14px}
.kpi b{display:block; font-family:var(--font-display); font-size:26px; letter-spacing:-.02em}
.kpi span{color:var(--muted); font-size:13px}
.fbta{font-size:16px; min-height:104px}
.btn.danger-b{border-color:var(--neg); color:var(--neg)}
.hcard{background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:18px; margin-top:14px}
.hcard .lab{color:var(--muted); font-size:13px; font-weight:600}
.hcard .big{display:block; font-family:var(--font-display); font-weight:700; font-size:clamp(36px,12vw,48px); letter-spacing:-.03em; line-height:1.1; margin:4px 0 10px; font-variant-numeric:tabular-nums}
.hrow{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:15px}
.hmini{display:flex; gap:18px; flex-wrap:wrap; color:var(--muted); font-size:13px; margin-top:12px; padding-top:12px; border-top:1px solid var(--line)}
.hmini b{color:var(--fg)}
.qa{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:20px 0 4px}
.qa button{background:none; border:0; display:flex; flex-direction:column; align-items:center; gap:7px; font-size:12px; font-weight:600; color:var(--fg); padding:0}
.qa i{width:56px; height:56px; border-radius:50%; background:var(--surface2); display:grid; place-items:center}
.qa .main i{background:var(--accent); color:var(--accent-fg)}
.qa svg{width:24px; height:24px}
.lcard{display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px 16px; text-align:left; margin-top:12px; color:var(--fg)}
.lcard>svg{width:18px; height:18px; color:var(--muted); flex:none}
.lcard .lr{display:flex; flex-direction:column; align-items:flex-end; gap:3px; margin-left:auto}
.lab2{display:block; color:var(--muted); font-size:13px; font-weight:600}
.lbig{display:block; font-family:var(--font-display); font-size:22px; font-weight:700; font-variant-numeric:tabular-nums}
.chipw{font-size:12px; font-weight:700; color:var(--warn); background:var(--surface2); padding:3px 9px; border-radius:99px; white-space:nowrap}

  var d=DEF(), s=Object.assign({},d.settings,(x&&x.settings)||{});

  if(!products.length&&(lots.length||sales.length))products.push({id:'p0',name:'Produto',price:+s.price||0});
  var p0=products.length?products[0].id:'';
  function fix(a){a.forEach(function(it){if(!it.pid||!products.some(function(p){return p.id===it.pid;}))it.pid=p0;});}
  fix(lots);fix(sales);
  goals.forEach(function(g){if(!g.pid||(g.pid!=='all'&&!products.some(function(p){return p.id===g.pid;})))g.pid='all';});
  var seen={};goals=goals.filter(function(g){var k=[g.type,g.target,g.start,g.end,g.pid].join('|');if(seen[k])return false;seen[k]=1;return true;});
  return {v:3,
    settings:{price:+s.price||0,days:Array.isArray(s.days)?s.days.slice():d.settings.days},
    products:products,goals:goals,lots:lots,sales:sales};
}

var SB_URL='https://iuqklnlszqmwsseratqb.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1cWtsbmxzenFtd3NzZXJhdHFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3MDcxMzUsImV4cCI6MjEwODI4MzEzNX0.VMNTN5BF3XOHT0_LH35Sut0Miffo6KhuvNwmp2ydjxw';

function authErr(m){m=String(m||'');
  if(/Invalid login/i.test(m))return 'E-mail ou senha incorretos.';

function authRender(){location.replace('login.html');}
function touch(){lsSave();dirty=true;setBadge(SESSION?'saving':'local');clearTimeout(saveTimer);saveTimer=setTimeout(flush,600);}
function flush(){
  if(!SESSION||!sb){dirty=false;return Promise.resolve();}
  if(saving){clearTimeout(saveTimer);saveTimer=setTimeout(flush,300);return Promise.resolve();}
  saving=true;dirty=false;
  var at=new Date().toISOString();
  return sb.from('crm_data').upsert({user_id:SESSION.user.id,state:normalize(S),updated_at:at}).then(function(r){
    saving=false;
    if(r&&r.error){dirty=true;setBadge('error');return;}
    remoteAt=new Date(at).getTime();setBadge('cloud');
    if(dirty){clearTimeout(saveTimer);saveTimer=setTimeout(flush,200);}
  },function(){saving=false;dirty=true;setBadge('error');});
}
function pull(){
  if(!SESSION||!sb||dirty||saving)return;
  sb.from('crm_data').select('state,updated_at').eq('user_id',SESSION.user.id).maybeSingle().then(function(r){
    if(!r||r.error||!r.data||dirty||saving)return;
    var t=new Date(r.data.updated_at).getTime();
    if(t>remoteAt+50){S=normalize(r.data.state);remoteAt=t;lsSave();render();}
  });
}
function startApp(sess){
  SESSION=sess;recovering=false;document.body.classList.remove('auth');document.body.classList.remove('boot');

}

/* ---------- perfil, feedback e administração ---------- */
var PROF=null,pf={name:'',wa:'',p1:'',p2:'',fb:'',msg:{}},ADM={users:null,fb:null,err:'',loading:false,view:'users'};

  if(n){s=n.split(/\s+/).slice(0,2).map(function(x){return x.charAt(0);}).join('');}
  else{s=((SESSION&&SESSION.user&&SESSION.user.email)||'?').charAt(0);}

  var um=(SESSION.user&&SESSION.user.user_metadata)||{};

function fmtDate(iso,withTime){

  try{return withTime?d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString('pt-BR');}catch(e){return iso.slice(0,10);}
}

function viewAdmin(){

/* ---------- utilidades ---------- */

function parseMoney(s){
  s=String(s==null?'':s).replace(/[^\d,.\-]/g,'');
  if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');
  var v=parseFloat(s); return isFinite(v)?v:0;
}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

function inP(x,pid){return !pid||pid==='all'||x.pid===pid;}
function pById(id){return S.products.find(function(p){return p.id===id;});}
function pname(id){var p=pById(id);return p?p.name:'';}
function lastPrice(pid){var l=S.sales.filter(function(s){return inP(s,pid);});return l.length?l[l.length-1].price:0;}
function prodPrice(pid){var p=pById(pid);if(p&&p.price>0)return p.price;var lp=lastPrice(pid);if(lp>0)return lp;return (!pid||pid==='all')?(S.settings.price||0):0;}
function defPid(){return (curP!=='all'&&pById(curP))?curP:(S.products[0]?S.products[0].id:'');}
function sellPid(){return (draft.pid&&pById(draft.pid))?draft.pid:defPid();}
function lotPid(){return (lotDraft.pid&&pById(lotDraft.pid))?lotDraft.pid:defPid();}
function ptag(pid){if(S.products.length<2)return '';var n=pid==='all'?'Todos os produtos':pname(pid);return n?'<span class="sub"><b style="color:var(--accent)">'+esc(n)+'</b></span>':'';}
function stock(pid){
  var rec=S.lots.filter(function(l){return l.status==='received'&&inP(l,pid);});
  var tr=S.lots.filter(function(l){return l.status==='transit'&&inP(l,pid);});
  var all=S.lots.filter(function(l){return inP(l,pid);});
  var inQty=sum(rec,function(l){return l.qty;});
  var recCost=sum(rec,function(l){return l.qty*l.unit+l.freight;});
  var sold=sum(S.sales.filter(function(s){return inP(s,pid);}),function(s){return s.qty;});
  var avg=inQty>0?recCost/inQty:0;
  var avail=inQty-sold;
  return {avail:avail,avg:avg,value:Math.max(0,avail)*avg,
    transitQty:sum(tr,function(l){return l.qty;}),
    transitCost:sum(tr,function(l){return l.qty*l.unit+l.freight;}),
    invested:sum(all,function(l){return l.qty*l.unit+l.freight;})};
}
function sRev(s){return s.qty*s.price;}
function sProfit(s){return s.qty*(s.price-s.cost);}
function rangeFor(p){
  var n=new Date(),d0=sod(n);
  if(p==='today')return [d0,new Date(+d0+864e5)];
  if(p==='7d')return [new Date(+d0-6*864e5),new Date(+d0+864e5)];
  return [new Date(n.getFullYear(),n.getMonth(),1),new Date(n.getFullYear(),n.getMonth()+1,1)];
}
function inRange(s,r){var t=new Date(s.ts);return t>=r[0]&&t<r[1];}
function agg(list){
  var rev=sum(list,sRev),pr=sum(list,sProfit),u=sum(list,function(s){return s.qty;});
  return {rev:rev,profit:pr,units:u,margin:rev>0?pr/rev:0,markup:(rev-pr)>0?pr/(rev-pr):0};
}
function goalLabel(t){return {lucro:'Líquido',faturamento:'Bruto',unidades:'Unidades'}[t];}
function fmtGoal(t,v){return t==='unidades'?int(v)+' un':brl(v);}
var STATUS={hit:['Meta batida','pos'],over:['Não atingida','neg'],prelim:['Em andamento',''],above:['Acima do ritmo','pos'],on:['No ritmo','pos'],below:['Abaixo do ritmo','neg']};
function recentPerDay(){
  var from=addD(new Date(),-29),act={},u=0;
  S.sales.forEach(function(s){var k=ymd(new Date(s.ts));if(k>=from){act[k]=1;u+=s.qty;}});
  var n=Object.keys(act).length;
  return n>0?String(Math.round(u/n*10)/10).replace('.',','):'';
}
function plan(type,target,start,end,perDay,priceOv,mode,pid){
  var n=new Date(),t0=ymd(n),days=S.settings.days;
  if(mode==='dia'&&perDay>0){target=perDay*sellDays(start,end);}else perDay=0;
  var sales=S.sales.filter(function(s){var k=ymd(new Date(s.ts));return k>=start&&k<=end&&inP(s,pid);});
  var a=agg(sales);
  var act={};sales.forEach(function(s){act[ymd(new Date(s.ts))]=1;});
  var keys=Object.keys(act).sort(),begin=keys.length?keys[0]:null,activeDays=keys.length;
  var todayCount=sales.filter(function(s){return ymd(new Date(s.ts))===t0;}).length;
  var elapsed=0,remaining=0,last=pYmd(end);
  for(var d=pYmd(start);d<=last;d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1)){
    if(days.indexOf(d.getDay())<0)continue;
    var k=ymd(d);
    if(k<t0){if(begin&&k>=begin)elapsed++;}
    else if(k===t0){if(todayCount>0)elapsed++;else remaining++;}
    else remaining++;
  }
  var den=Math.max(elapsed,activeDays),st=stock(pid);
  var price=prodPrice(pid);
  var cost=st.avg>0?st.avg:(a.units>0?sum(sales,function(s){return s.qty*s.cost;})/a.units:0);
  if(priceOv>0)price=priceOv;
  var okP=price>0,up=price-cost;
  var ut=type==='unidades'?target:(type==='faturamento'?(okP?Math.ceil(target/price):null):(okP&&up>0?Math.ceil(target/up):null));
  var bt=type==='faturamento'?target:(ut!=null&&okP?ut*price:null);
  var lt=type==='lucro'?target:(ut!=null&&okP?ut*up:null);
  var uf=ut==null?null:Math.max(0,ut-a.units);
  var bf=type==='faturamento'?(bt==null?null:Math.max(0,bt-a.rev)):(uf==null||!okP?null:uf*price);
  var lf=type==='lucro'?(lt==null?null:Math.max(0,lt-a.profit)):(uf==null||!okP?null:uf*up);
  var need0=(uf!=null&&remaining>0)?uf/remaining:0;
  var pace=perDay>0?perDay:(den>0?a.units/den:need0);
  var pu=a.units+pace*remaining;
  var pb=okP?a.rev+pace*remaining*price:null;
  var pl=okP?a.profit+pace*remaining*up:null;
  var done=type==='unidades'?a.units:type==='faturamento'?a.rev:a.profit;
  var proj=type==='unidades'?pu:type==='faturamento'?pb:pl;
  var prelim=!(perDay>0)&&(den<3||activeDays<2);
  var status;
  if(done>=target)status='hit';
  else if(remaining===0)status='over';
  else if(prelim)status='prelim';
  else if(proj!=null&&proj>=target*1.1)status='above';
  else if(proj!=null&&proj>=target)status='on';
  else status='below';
  var have=Math.max(0,st.avail)+st.transitQty;
  var need=(uf!=null&&remaining>0)?uf/remaining:null;
  return {target:target,need:need,u0:a.units,b0:a.rev,l0:a.profit,ut:ut,bt:bt,lt:lt,uf:uf,bf:bf,lf:lf,pu:pu,pb:pb,pl:pl,pace:pace,remaining:remaining,den:den,
    done:done,prelim:prelim,status:status,price:price,cost:cost,up:up,have:have,deficit:uf==null?null:Math.max(0,uf-have)};
}

function m2(n){return n==null?'–':n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmt1(n){return String(Math.round(n*10)/10).replace('.',',');}
function isMonth(s,e){var a=pYmd(s),b=pYmd(e);return a.getDate()===1&&new Date(b.getFullYear(),b.getMonth(),b.getDate()+1).getDate()===1;}
function needBlock(c){
  if(c.uf==null||c.uf<=0||!(c.remaining>0)||c.need==null)return '';
  var low=c.pace>0&&c.need>c.pace*1.1;
  return '<div class="need"><div class="nl">Precisa vender por dia</div><div class="nv'+(low?' neg':'')+'">'+fmt1(c.need)+' un'+(c.price>0?'<small>≈ '+m2(c.need*c.price)+' bruto</small>':'')+'</div>'+
    '<div class="sub">'+c.remaining+(c.remaining===1?' dia de venda restante':' dias de venda restantes')+(c.pace>0?' · seu ritmo: '+fmt1(c.pace)+' un/dia':'')+'</div></div>';
}
function planTable(c){
  var K={meta:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.8"/>',
    real:'<circle cx="12" cy="12" r="8.5"/><path d="M8 12.5l3 3 5-6"/>',
    pend:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
    proj:'<path d="M4 17l5-5 4 3 7-8"/><path d="M15 7h5v5"/>'};
  function card(k,l,u,b,li,cls){return '<div class="kc'+(cls?' '+cls:'')+'"><div class="kh">'+aIc(K[k])+'<span>'+l+'</span></div>'+
    '<div class="ku">'+(u==null?'–':int(u))+'<small> un</small></div>'+
    '<div class="kl"><span>Bruto</span><b>R$ '+m2(b)+'</b></div><div class="kl"><span>Líquido</span><b>R$ '+m2(li)+'</b></div></div>';}
  return needBlock(c)+'<div class="kg">'+card('meta','Meta',c.ut,c.bt,c.lt)+card('real','Realizado',c.u0,c.b0,c.l0,'done')+card('pend','Pendente',c.uf,c.bf,c.lf)+card('proj','Projeção',c.pu,c.pb,c.pl)+'</div>'+
    (c.cost>0?'':'<p class="note" style="margin:10px 0 0">Cadastre um lote para calcular o líquido.</p>')+
    '<p class="note" style="margin:12px 0 0">'+(c.deficit==null?'':c.deficit>0?'Você tem '+int(c.have)+' un (estoque e a caminho). Faltam comprar '+int(c.deficit)+' un.':'Seu estoque cobre a meta.')+'</p>';
}
function goalTitle(g){return g.type==='unidades'?int(g.target)+' unidades':g.type==='lucro'?brl(g.target)+' líquido':brl(g.target)+' bruto';}
function goalCard(g){
  var c=plan(g.type,g.target,g.start,g.end,g.perDay,g.price||0,g.mode,g.pid);
  var st=STATUS[c.status],f=Math.min(1,c.done/g.target),arm=armed===g.id;
  var ic=function(p){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';};
  return '<div class="goal"><div class="gh"><div class="gt"><b>Meta de '+goalTitle(g)+'</b>'+ptag(g.pid)+
    '<div class="gmeta"><span class="sub">'+(g.mode==='dia'?fmt1(g.perDay)+' un/dia · ':'')+(isMonth(g.start,g.end)?'Meta do mês · ':'')+dmShort(g.start)+' a '+dmShort(g.end)+'</span><span class="pill '+st[1]+'">'+st[0]+'</span></div></div>'+

    '<div class="prog"><i style="width:'+(f*100)+'%"></i></div><div class="sub">'+pct(f)+' da meta atingida</div>'+
    planTable(c)+'</div>';
}

function updateSim(){
  var out=$('#sim-out'); if(!out)return;
  sim.mode='total';var dia=false;
  var v=simVals(),pd=dia?parseMoney(sim.perDay):0,pr=parseMoney(v.price),r=periodRange(sim.period);
  var target=dia?pd*sellDays(r[0],r[1]):parseMoney(sim.target);
  if(dia?!(pd>0):!(target>0)){out.innerHTML='<p class="note" style="margin:0">'+(dia?'Digite quantas unidades por dia.':'Digite a meta para ver quantas unidades precisa vender.')+'</p>';return;}
  var c=plan(sim.type,target,r[0],r[1],pd,pr,dia?'dia':'total',sim.pid);
  if(c.ut==null){out.innerHTML='<p class="note neg" style="margin:0">'+(pr>0?'Com esse preço e o custo atual cada unidade não dá lucro. A meta não é possível assim.':'Informe o preço por unidade.')+'</p>';return;}
  if(c.remaining===0){out.innerHTML='<p class="note neg" style="margin:0">Nenhum dia de venda neste período. Ajuste os dias em que você vende.</p>';return;}
  var st=STATUS[c.status];
  out.innerHTML='<div class="res"><span class="pill '+st[1]+'">'+st[0]+'</span>'+(sim.type!=='unidades'?'<p class="note" style="margin:10px 0 0">Vendendo a R$ '+m2(c.price)+' cada, você precisa de <b>'+int(c.ut)+' unidades</b>.</p>':'')+planTable(c)+
    '<button class="btn primary" style="margin-top:16px" data-act="save-goal">'+(editGoal?'Salvar alterações':'Salvar meta')+'</button></div>';
}

function norm(s){return String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();}
function clientList(){
  var seen={},out=[];
  S.sales.slice().sort(function(a,b){return a.ts<b.ts?1:-1;}).forEach(function(s){var c=(s.client||'').trim();if(c&&!seen[norm(c)]){seen[norm(c)]=1;out.push(c);}});
  return out.slice(0,50);
}
function dayLabel(k){
  var n=new Date();
  if(k===ymd(n))return 'Hoje';
  if(k===addD(n,-1))return 'Ontem';
  return WD[pYmd(k).getDay()]+' '+dmShort(k);
}
function salesRange(){
  var n=new Date(),t0=ymd(n);
  if(salesPeriod==='today')return [t0,t0];
  if(salesPeriod==='7d')return [addD(n,-6),t0];
  if(salesPeriod==='month')return [monthStart(n),monthEnd(n)];
  if(salesPeriod==='custom')return [salesFrom||'0000-00-00',salesTo||'9999-99-99'];
  return ['0000-00-00','9999-99-99'];
}
function filteredSales(rng){
  var r=rng||salesRange(),q=norm(salesQ).trim();
  return S.sales.filter(function(s){
    var k=ymd(new Date(s.ts));
    if(!inP(s,curP))return false;
    if(k<r[0]||k>r[1])return false;
    if(salesPay!=='all'&&s.pay!==salesPay)return false;
    if(q&&norm((s.client||'')+' '+(s.place||'')+' '+(s.note||'')).indexOf(q)<0)return false;
    return true;
  }).sort(function(a,b){return a.ts<b.ts?1:-1;});
}

var lineSeries={units:[],rev:[],full:[],range:''};
function mshort(n){return Math.round(n*100)%100===0?'R$ '+Math.round(n).toLocaleString('pt-BR'):brl(n);}
function buildSeries(list){
  var n=new Date(),t0=ymd(n),r=salesRange();
  var keys=list.map(function(s){return ymd(new Date(s.ts));}).sort();
  var start=r[0]==='0000-00-00'?keys[0]:r[0],end=r[1]==='9999-99-99'?t0:r[1];
  if(end>t0)end=t0;
  if(keys.length&&keys[keys.length-1]>end)end=keys[keys.length-1];
  var days=Math.round((pYmd(end)-pYmd(start))/864e5)+1,src=list;
  if(days>366){start=addD(pYmd(end),-365);days=366;}
  if(days<7){start=addD(pYmd(end),-6);days=7;src=filteredSales([start,end]);}
  var s0=pYmd(start),units=[],rev=[],full=[],i;
  for(i=0;i<days;i++){units.push(0);rev.push(0);full.push(dayLabel(addD(s0,i)));}
  src.forEach(function(s){
    var idx=Math.round((pYmd(ymd(new Date(s.ts)))-s0)/864e5);
    if(idx>=0&&idx<days){units[idx]+=s.qty;rev[idx]+=sRev(s);}
  });
  lineSeries={units:units,rev:rev,full:full,range:dmShort(start)+' a '+dmShort(end)};
}
function fmtVal(key,v){return key==='rev'?mshort(v):int(v);}
function smoothPath(pts){
  var n=pts.length,d='M'+pts[0][0].toFixed(2)+' '+pts[0][1].toFixed(2);
  for(var i=0;i<n-1;i++){
    var p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    var c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6,c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;
    var lo=Math.min(p1[1],p2[1]),hi=Math.max(p1[1],p2[1]);
    c1y=Math.max(lo,Math.min(hi,c1y));c2y=Math.max(lo,Math.min(hi,c2y));
    d+=' C'+c1x.toFixed(2)+' '+c1y.toFixed(2)+' '+c2x.toFixed(2)+' '+c2y.toFixed(2)+' '+p2[0].toFixed(2)+' '+p2[1].toFixed(2);
  }
  return d;
}
function lineChart(key,title){
  var v=lineSeries[key],n=v.length,mx=Math.max.apply(null,v)||0,tot=0,pts=[],i;
  for(i=0;i<n;i++){tot+=v[i];pts.push([n>1?i/(n-1)*100:0,44-(mx>0?v[i]/mx*36:0)]);}
  var line=smoothPath(pts),area=line+' L100 50 L0 50 Z',last=pts[n-1],dv=fmtVal(key,tot);
  return '<div class="lc" data-dv="'+esc(dv)+'" data-ds="'+esc(lineSeries.range)+'"><div class="ch"><div class="ct"><span class="lt">'+title+'</span><span class="lsub">'+lineSeries.range+'</span></div><span class="lv">'+dv+'</span></div>'+
    '<div class="plot" data-s="'+key+'" data-lx="'+last[0]+'" data-ly="'+(last[1]/50*100)+'"><svg viewBox="0 0 100 50" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="g-'+key+'" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0" style="stop-color:var(--accent);stop-opacity:.38"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:.02"/></linearGradient></defs>'+
    '<path d="'+area+'" fill="url(#g-'+key+')"/><path d="'+line+'" fill="none" style="stroke:var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>'+
    '<i class="gl" hidden></i><i class="dot" style="left:'+last[0]+'%;top:'+(last[1]/50*100)+'%"></i></div></div>';
}
function chartHover(plot,e){
  var key=plot.dataset.s,v=lineSeries[key],n=v?v.length:0; if(!n)return;
  var r=plot.getBoundingClientRect(),x=Math.max(0,Math.min(1,(e.clientX-r.left)/(r.width||1)));
  var i=n>1?Math.round(x*(n-1)):0,mx=Math.max.apply(null,v)||0,px=n>1?i/(n-1)*100:0,lc=plot.parentNode;
  var gl=plot.querySelector('.gl'),dot=plot.querySelector('.dot');
  gl.hidden=false;gl.style.left=px+'%';
  dot.style.left=px+'%';dot.style.top=((44-(mx>0?v[i]/mx*36:0))/50*100)+'%';
  lc.querySelector('.lv').textContent=fmtVal(key,v[i]);
  lc.querySelector('.lsub').textContent=lineSeries.full[i];
}
function chartReset(plot){
  var lc=plot.parentNode,gl=plot.querySelector('.gl'),dot=plot.querySelector('.dot');
  gl.hidden=true;dot.style.left=plot.dataset.lx+'%';dot.style.top=plot.dataset.ly+'%';

function renderSalesBody(){

    '<div class="stats" style="margin:0 0 6px"><div class="stat"><div class="v">'+int(a.units)+'</div><div class="k">Unidades</div></div>'+
    '<div class="stat"><div class="v">'+brl(a.rev)+'</div><div class="k">Bruto</div></div>'+
    '<div class="stat"><div class="v '+(a.profit<0?'neg':'pos')+'">'+brl(a.profit)+'</div><div class="k">Líquido</div></div></div>';

function submitSale(){
  var qty=parseInt(draft.qty,10)||0,price=parseMoney(draft.price);
  if(qty<1){toast('Informe a quantidade');return;}
  if(!(price>0)){toast('Informe o preço por unidade');return;}
  var pid=sellPid();if(!pid){toast('Cadastre um produto primeiro');return;}
  var st=stock(pid),old=editing?S.sales.find(function(s){return s.id===editing;}):null;
  var avail=st.avail+(old&&old.pid===pid?old.qty:0);
  if(qty>avail){toast('Estoque insuficiente: '+int(Math.max(0,avail))+' disponíveis');return;}
  var now=new Date(),ts;
  if(old&&draft.date===ymd(new Date(old.ts)))ts=old.ts;
  else if(!draft.date||draft.date===ymd(now))ts=now.toISOString();
  else{var p=draft.date.split('-');ts=new Date(+p[0],+p[1]-1,+p[2],12,0).toISOString();}
  if(old){if(old.pid!==pid){old.cost=r2(st.avg);old.pid=pid;}old.qty=qty;old.price=price;old.pay=draft.pay;old.ts=ts;old.place=draft.place.trim();old.note=draft.note.trim();old.client=draft.client.trim();}
  else S.sales.push({id:uid(),pid:pid,ts:ts,qty:qty,price:price,pay:draft.pay,place:draft.place.trim(),note:draft.note.trim(),client:draft.client.trim(),cost:r2(st.avg)});
  S.settings.price=price;var spp=pById(pid);if(spp)spp.price=price;
  var wasEdit=!!old;
  resetDraft(); touch(); render(); toast(wasEdit?'Venda atualizada':'Venda registrada');
}
function saveLot(){
  var q=parseInt(lotDraft.qty,10)||0,u=parseMoney(lotDraft.unit),f=Math.max(0,parseMoney(lotDraft.freight));
  if(q<1){toast('Informe a quantidade');return;}
  if(!(u>0)){toast('Informe o custo por unidade');return;}
  var lpid=lotPid();if(!lpid){toast('Cadastre um produto primeiro');return;}
  var today=ymd(new Date());
  S.lots.push({id:uid(),pid:lpid,date:today,qty:q,unit:r2(u),freight:r2(f),status:lotDraft.arrived?'received':'transit',eta:lotDraft.eta||'',recvDate:lotDraft.arrived?today:''});
  lotDraft={open:false,qty:'',unit:'',freight:'',eta:'',arrived:false};
  touch();render();toast('Lote salvo');
}
function receiveLot(id,q){
  var l=S.lots.find(function(x){return x.id===id;}); if(!l)return;
  if(q<1){toast('Informe quantas chegaram');return;}
  if(q>l.qty){toast('Esse lote tem só '+int(l.qty)+' em transporte');return;}
  var today=ymd(new Date());
  if(q===l.qty){l.status='received';l.recvDate=today;}
  else{
    var fr=r2(l.freight*(q/l.qty));
    S.lots.push({id:uid(),pid:l.pid,date:l.date,qty:q,unit:l.unit,freight:fr,status:'received',eta:l.eta,recvDate:today});
    l.qty-=q;l.freight=r2(l.freight-fr);
  }
  recvOpen=null;touch();render();toast('Recebimento registrado');
}
