<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CRM · Entrar</title>
<meta name="theme-color" content="#0e1113">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: single-column phone app. Sticky top bar, one scrolling view at a time, fixed bottom tab bar. Dark graphite first, light as the alternate. */
:root{
  --bg:#0e1113; --surface:#151a1d; --surface2:#1c2226; --line:#262e33;
  --fg:#e8edef; --muted:#8a979f; --pos:#3ddc97; --neg:#ff6b6b; --warn:#f2b84b;
  --accent:#3ddc97; --accent-fg:#052619; --track:#232b30;
  --font-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --font-body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f2f5f6; --surface:#ffffff; --surface2:#e9eef0; --line:#d9e0e3;
    --fg:#13181b; --muted:#5b6770; --pos:#0c9a62; --neg:#d23f3f; --warn:#a96f00;
    --accent:#0c9a62; --accent-fg:#ffffff; --track:#dfe6e9; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f2f5f6; --surface:#ffffff; --surface2:#e9eef0; --line:#d9e0e3;
  --fg:#13181b; --muted:#5b6770; --pos:#0c9a62; --neg:#d23f3f; --warn:#a96f00;
  --accent:#0c9a62; --accent-fg:#ffffff; --track:#dfe6e9; color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:15px; line-height:1.4;
  padding-block:0; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); background:var(--bg); z-index:10}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.top{position:sticky; top:env(safe-area-inset-top, 0px); z-index:9; background:var(--bg); display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0 10px; max-width:560px; margin:0 auto; border-bottom:1px solid var(--line)}
.brand{font-family:var(--font-display); font-weight:700; font-size:17px; letter-spacing:-.01em}
.badge{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted)}
.badge i{width:7px; height:7px; border-radius:50%; background:var(--muted); display:inline-block}
.badge.cloud,.badge.saving,.badge.load{display:none}
.badge.cloud i{background:var(--pos)} .badge.saving i{background:var(--warn)} .badge.error i{background:var(--neg)}
main{max-width:560px; margin:0 auto; padding:16px 0 110px; min-width:0}
h1{font-family:var(--font-display); font-weight:700; font-size:22px; letter-spacing:-.02em; margin:0 0 14px}
h2{font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 10px}
.sec{padding:18px 0; border-top:1px solid var(--line)} .sec:first-child{border-top:0; padding-top:4px}
.muted{color:var(--muted)} .pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}
.num{font-variant-numeric:tabular-nums; font-family:var(--font-display); letter-spacing:-.01em}
.hero{display:flex; flex-direction:column; gap:2px}
.hero .big{font-family:var(--font-display); font-weight:700; font-size:44px; letter-spacing:-.03em; line-height:1.05; font-variant-numeric:tabular-nums}
.hero .lab{color:var(--muted); font-size:13px}
.stats{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-top:16px}
.stat .v{font-family:var(--font-display); font-weight:700; font-size:17px; font-variant-numeric:tabular-nums; overflow-wrap:anywhere}
.stat .k{font-size:12px; color:var(--muted)}
.seg{display:flex; gap:4px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:3px}
.seg button{flex:1; border:0; background:transparent; padding:9px 6px; border-radius:9px; color:var(--muted); font-weight:600; min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface2); color:var(--fg)}
.field{display:flex; flex-direction:column; gap:7px; margin-bottom:16px; min-width:0}
.field>label,.lab-s{font-size:13px; font-weight:600; color:var(--muted)}
.hint{font-size:13px; color:var(--muted); min-height:18px}
.stepper{display:grid; grid-template-columns:64px minmax(0,1fr) 64px; gap:8px}
.step{border:1px solid var(--line); background:var(--surface); border-radius:12px; font-size:26px; min-height:56px}
.step:active{background:var(--surface2)}
textarea{width:100%; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; font-size:14px; min-width:0; resize:vertical}
input[type=text],input[type=date],input:not([type]),select{width:100%; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:0 14px; min-height:52px; font-size:17px; min-width:0}
.stepper input{text-align:center; font-family:var(--font-display); font-weight:700; font-size:28px}
.money{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:0 14px}
.money span{color:var(--muted); font-weight:600}
.money input{border:0; background:transparent; padding:0; min-height:52px; font-size:20px; font-weight:600; flex:1; min-width:0}
.money input:focus-visible{outline:0}
.money:focus-within{outline:2px solid var(--accent); outline-offset:2px}
details summary{cursor:pointer; color:var(--muted); font-weight:600; font-size:13px; padding:4px 0 12px; list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"+ "}
details[open] summary::before{content:"− "}
.btn{display:flex; width:100%; align-items:center; justify-content:center; gap:8px; min-height:54px; border-radius:14px; border:1px solid var(--line); background:var(--surface); font-weight:700; font-size:16px; padding:0 16px}
.btn.primary{background:var(--accent); color:var(--accent-fg); border-color:transparent}
.btn.primary:disabled{opacity:.45}
.btn.ghost{background:transparent; margin-top:10px}
.btn.small{min-height:40px; font-size:14px; width:auto; border-radius:10px}
.list{display:flex; flex-direction:column}
.item{display:flex; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid var(--line); align-items:flex-start}
.item:first-child{border-top:0}
.item .l,.item .r{min-width:0; display:flex; flex-direction:column; gap:2px}
.item .r{align-items:flex-end; text-align:right; flex-shrink:0}
.item b{font-weight:600}
.item .sub{font-size:13px; color:var(--muted); overflow-wrap:anywhere}
.acts{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.kg{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px}
.kc{background:var(--surface2); border:1px solid var(--line); border-radius:12px; padding:12px; min-width:0}
.kc .kh{display:flex; align-items:center; gap:6px; color:var(--muted); font-size:13px; font-weight:600}
.kc .kh svg{width:16px; height:16px}
.kc .ku{font-family:'Bricolage Grotesque',sans-serif; font-size:28px; font-weight:700; line-height:1.15; margin:6px 0 8px}
.kc .ku small{font-family:'Figtree',sans-serif; font-size:13px; font-weight:600; color:var(--muted)}
.kc .kl{display:flex; justify-content:space-between; gap:6px; font-size:13px; padding-top:4px}
.kc .kl span{color:var(--muted)}
.kc.done .ku,.kc.done .kl b{color:var(--pos)}
.pcard{border:1px solid var(--line); border-radius:14px; background:var(--surface); margin-bottom:10px; overflow:hidden}
.ph{display:flex; align-items:center; gap:12px; width:100%; padding:14px; background:none; border:0; text-align:left}
.ph .pl{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px}
.ph .pl b{font-size:17px}
.ph .pr{display:flex; flex-direction:column; align-items:flex-end; gap:2px; text-align:right}
.ph .pn{font-family:var(--font-display); font-size:26px; font-weight:700; line-height:1}
.ph .pn small{font-family:'Figtree',sans-serif; font-size:13px; color:var(--muted); font-weight:600}
.ph>svg{width:18px; height:18px; flex:none; color:var(--muted); transition:transform .15s}
.ph[aria-expanded=true]>svg{transform:rotate(180deg)}
.pdet{padding:0 14px 14px; border-top:1px solid var(--line)}
.dd{position:relative}
.ddb{display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; min-height:52px; padding:0 14px; background:var(--surface); border:1px solid var(--line); border-radius:12px; font-size:17px; text-align:left}
.ddb span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ddb svg{width:18px; height:18px; flex:none; color:var(--muted); transition:transform .15s}
.dd.open .ddb{border-color:var(--accent)}
.dd.open .ddb svg{transform:rotate(180deg)}
.ddl{position:absolute; left:0; right:0; top:calc(100% + 6px); z-index:20; background:var(--surface2); border:1px solid var(--line); border-radius:12px; box-shadow:0 12px 32px rgba(0,0,0,.4); max-height:min(300px,50vh); overflow:auto; padding:4px}
.ddl.up{top:auto; bottom:calc(100% + 6px)}
.ddo{display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; min-height:48px; padding:0 12px; border:0; background:none; border-radius:8px; font-size:16px; text-align:left}
.ddo[aria-selected=true]{color:var(--accent); font-weight:600}
.ddo:active{background:var(--surface)}
.ddo svg{width:18px; height:18px; flex:none}
.need{background:var(--surface2); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin:12px 0}
.need .nl{font-size:13px; color:var(--muted); font-weight:600}
.need .nv{font-family:'Bricolage Grotesque',sans-serif; font-size:30px; font-weight:700; color:var(--pos); line-height:1.15; margin:2px 0 4px}
.need .nv.neg{color:var(--neg)}
.need .nv small{font-family:'Figtree',sans-serif; font-size:13px; font-weight:600; color:var(--muted); margin-left:10px}
.gb.ok{border-color:var(--accent); color:var(--accent)}
.goal{padding:18px 0; border-top:1px solid var(--line)}
.goal:first-of-type{border-top:0; padding-top:2px}
.goal .gh{display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px 12px}
.goal .gt{display:flex; flex-direction:column; gap:6px; min-width:0; flex:1 1 150px}
.goal .gt>b{font-size:16px}
.goal .gmeta{display:flex; align-items:center; flex-wrap:wrap; gap:6px 10px}
.goal .gacts{display:flex; gap:8px; margin-left:auto}
.gb{display:inline-flex; align-items:center; gap:6px; min-height:40px; padding:0 12px; border:1px solid var(--line); background:var(--surface2); color:var(--fg); border-radius:10px; font-weight:600; font-size:14px}
.gb svg{width:16px; height:16px}
.gb:active{background:var(--surface)}
.gb.danger{border-color:var(--neg); color:var(--neg)}
.goal .sub{font-size:13px; color:var(--muted)}
.goal .gleft{font-family:var(--font-display); font-size:24px; font-weight:700; letter-spacing:-.02em; margin-top:10px; font-variant-numeric:tabular-nums}
.res{margin-top:6px}
.charts{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin:16px 0 6px}
.lc{min-width:0; background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden; padding-top:14px}
.ch{display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:4px 8px; padding:0 14px}
.ct{display:flex; flex-direction:column; gap:2px; min-width:0}
.lt{font-size:14px; font-weight:700}
.lsub{font-size:12px; color:var(--muted); overflow-wrap:anywhere}
.lv{font-family:var(--font-display); font-weight:700; font-size:clamp(18px,5.6vw,26px); letter-spacing:-.02em; line-height:1.1; color:var(--pos); font-variant-numeric:tabular-nums; margin-left:auto}
.plot{position:relative; height:112px; margin-top:8px; touch-action:pan-y; cursor:crosshair}
.plot svg{display:block; width:100%; height:100%}
.plot .gl{position:absolute; top:0; bottom:0; width:1px; background:var(--muted); opacity:.4}
.plot .dot{position:absolute; width:11px; height:11px; border-radius:50%; background:var(--accent); border:2px solid var(--surface); transform:translate(-50%,-50%)}
.dayh{display:flex; justify-content:space-between; gap:12px; padding:18px 0 6px; font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.dayh:first-child{padding-top:4px}
.sale{border-top:1px solid var(--line)}
.dayh+.sale{border-top:0}
.srow{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; width:100%; background:none; border:0; padding:12px 0; text-align:left; min-height:56px; color:inherit}
.srow .l,.srow .r{display:flex; flex-direction:column; gap:2px; min-width:0}
.srow .r{align-items:flex-end; text-align:right; flex-shrink:0}
.srow .l b{font-weight:600; overflow-wrap:anywhere}
.srow .sub{font-size:13px; color:var(--muted); overflow-wrap:anywhere}
.det{padding:2px 0 14px}
.sale.open .srow .l b::after{content:" ▴"; color:var(--muted); font-size:11px}
.sale:not(.open) .srow .l b::after{content:" ▾"; color:var(--muted); font-size:11px}
.duo{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px}
.duo .big{font-size:clamp(22px,7.2vw,34px); overflow-wrap:anywhere}
.tbl{margin-top:14px}
.tbl .tr{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,.55fr) minmax(0,1.15fr) minmax(0,1.15fr); gap:8px; padding:10px 0; border-top:1px solid var(--line); font-size:14px; align-items:baseline}
.tbl .tr span{color:var(--muted)}
.tbl .tr b{text-align:right; font-weight:600; font-variant-numeric:tabular-nums; overflow-wrap:anywhere}
.tbl .th{border-top:0; padding:0 0 8px; font-size:12px}
.tbl .th b{color:var(--muted); font-weight:600}
.tbl .done b{color:var(--pos)}
.tbl .tr.meta b{font-family:var(--font-display); font-size:15px}
.pill{display:inline-flex; align-items:center; font-size:12px; font-weight:700; padding:3px 9px; border-radius:99px; background:var(--surface2); color:var(--muted)}
.pill.pos{color:var(--pos)} .pill.warn{color:var(--warn)} .pill.neg{color:var(--neg)}
.bars{display:grid; grid-template-columns:repeat(14,minmax(0,1fr)); gap:4px; align-items:end; height:96px; margin-top:6px}
.bars .c{display:flex; flex-direction:column; justify-content:flex-end; height:100%; background:none; border:0; padding:0; min-width:0; cursor:pointer; color:inherit}
.bars .b{background:var(--track); border-radius:4px 4px 2px 2px; min-height:3px}
.bars .c:hover .b{background:var(--muted)}
.bars .c.sel .b,.bars .c.sel:hover .b{background:var(--accent)}
.chartwrap{position:relative}
.tip{position:absolute; top:-6px; transform:translateY(-100%); background:var(--fg); color:var(--bg); padding:8px 11px; border-radius:10px; font-size:12px; line-height:1.45; white-space:nowrap; pointer-events:none; z-index:5}
.dayinfo{font-size:13px; color:var(--muted); min-height:20px; margin:0 0 10px}
.dayinfo b{color:var(--fg)}
.bars-l{display:grid; grid-template-columns:repeat(14,minmax(0,1fr)); gap:4px; margin-top:6px; font-size:10px; color:var(--muted); text-align:center}
.prog{height:8px; border-radius:99px; background:var(--track); overflow:hidden; margin:8px 0 6px}
.prog i{display:block; height:100%; background:var(--accent); border-radius:99px}
.kv{display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.kv span:first-child{color:var(--muted)}
.kv b{font-variant-numeric:tabular-nums; text-align:right}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chips button{border:1px solid var(--line); background:var(--surface); border-radius:99px; padding:0 14px; min-height:40px; font-weight:600; color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--accent); color:var(--accent-fg); border-color:transparent}
.row2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
.empty{padding:28px 0; text-align:left}
.empty p{color:var(--muted); margin:6px 0 16px; max-width:38ch}
.note{font-size:13px; color:var(--muted); line-height:1.5}
.nav{position:fixed; left:0; right:0; bottom:0; z-index:9; background:var(--bg); border-top:1px solid var(--line); padding:6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px))}
.nav div{max-width:560px; margin:0 auto; display:grid; grid-template-columns:repeat(6,minmax(0,1fr))}
.nav button{background:none; border:0; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0; color:var(--muted); font-size:11px; font-weight:600; min-height:52px}
.nav button svg{width:24px; height:24px}
.nav button[aria-current="page"]{color:var(--accent)}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(84px + env(safe-area-inset-bottom, 0px)); background:var(--fg); color:var(--bg); padding:10px 16px; border-radius:99px; font-weight:600; font-size:14px; z-index:12; max-width:calc(100vw - 32px); text-align:center}
@media (prefers-reduced-motion:no-preference){ .prog i{transition:width .3s ease} }
body.auth .nav{display:none}
input[type=password],input[type=email],input[type=tel]{width:100%; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:0 14px; min-height:52px; font-size:17px; min-width:0}
body{padding-top:env(safe-area-inset-top,0px)}
.hr{display:flex; align-items:center; gap:10px}
.avatar{width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--surface2); color:var(--fg); font-weight:700; font-size:14px; display:grid; place-items:center; padding:0; flex:none}
.avatar[aria-current="page"]{border-color:var(--accent); color:var(--accent)}
.kpis{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.kpi{border:1px solid var(--line); background:var(--surface); border-radius:14px; padding:14px}
.kpi b{display:block; font-family:var(--font-display); font-size:26px; letter-spacing:-.02em}
.kpi span{color:var(--muted); font-size:13px}
.fbta{font-size:16px; min-height:104px}
.btn.danger-b{border-color:var(--neg); color:var(--neg)}
#wiz[hidden]{display:none}
#wiz{position:fixed; inset:0; z-index:11; background:var(--bg); overflow-y:auto; -webkit-overflow-scrolling:touch}
body.wizopen{overflow:hidden}
.wz{max-width:560px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; padding:calc(6px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px))}
.wz-top{display:flex; align-items:center; justify-content:space-between; min-height:50px}
.wz-back,.wz-sp{width:44px; height:44px; flex:none}
.wz-back{border:0; background:none; color:var(--fg); display:grid; place-items:center; border-radius:50%; margin-left:-10px}
.wz-back svg{width:26px; height:26px}
.wz-dots{display:flex; gap:6px}
.wz-dots i{width:24px; height:4px; border-radius:2px; background:var(--line)}
.wz-dots i.on{background:var(--accent)}
.wz-body{flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; gap:16px; padding:10px 0}
.wz-lab{color:var(--muted); font-weight:600; font-size:14px}
.wz-amt{font-family:var(--font-display); font-weight:700; font-size:clamp(42px,14vw,64px); letter-spacing:-.03em; color:var(--line); font-variant-numeric:tabular-nums; line-height:1.1}
.wz-amt.on{color:var(--fg)}
.wz-chips{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; min-height:46px}
.wz-chip{border:1px solid var(--line); background:var(--surface); border-radius:99px; padding:0 22px; min-height:46px; font-weight:700; font-size:16px}
.wz-pad{display:grid; grid-template-columns:repeat(3,1fr); gap:2px; margin:4px 0 12px}
.wz-pad button{background:none; border:0; min-height:62px; font-family:var(--font-display); font-size:30px; font-weight:500; border-radius:16px; display:grid; place-items:center; color:var(--fg)}
.wz-pad button:active,.wz-chip:active{background:var(--surface2)}
.wz-pad svg{width:30px; height:30px}
.wz-main{flex:1; padding:8px 0 16px}
.wz-opt{display:flex; align-items:center; gap:14px; width:100%; text-align:left; border:1px solid transparent; background:none; border-radius:16px; padding:14px 16px; font-size:17px; min-height:62px; color:var(--fg); margin-bottom:6px}
.wz-opt[aria-pressed="true"]{background:var(--surface2); border-color:var(--fg)}
.wz-opt .radio{width:22px; height:22px; border-radius:50%; border:2px solid var(--fg); flex:none; display:grid; place-items:center}
.wz-opt[aria-pressed="true"] .radio::after{content:""; width:10px; height:10px; border-radius:50%; background:var(--fg)}
.wz-t{display:flex; flex-direction:column; gap:2px; font-weight:600}
.wz-t small{font-weight:500; color:var(--muted); font-size:13px}
.wz-foot{padding-top:8px; display:flex; flex-direction:column; gap:8px}
.wz-sum{display:flex; justify-content:space-between; align-items:baseline; gap:12px; font-size:16px; font-weight:600}
.wz-sum b{font-family:var(--font-display); font-size:22px; font-variant-numeric:tabular-nums; white-space:nowrap; flex:none}
.wz-sum span{min-width:0; overflow-wrap:anywhere}
.wz-sum.sub{font-size:14px; color:var(--muted)} .wz-sum.sub b{font-size:16px}
.wz-cta{display:flex; width:100%; min-height:58px; border-radius:99px; border:0; background:var(--accent); color:var(--accent-fg); font-weight:700; font-size:17px; align-items:center; justify-content:center; margin-top:4px}
.wz-cta:disabled{background:var(--surface2); color:var(--muted)}
.wz-ok{width:84px; height:84px; border-radius:50%; background:var(--accent); color:var(--accent-fg); display:grid; place-items:center}
.wz-ok svg{width:44px; height:44px}
.nav{background:linear-gradient(to top,var(--bg) 62%,transparent); border-top:0; padding-top:10px; padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.nav>div{max-width:560px; margin:0 auto; display:flex; gap:10px; align-items:stretch}
.nav .navtabs{flex:1; min-width:0; max-width:none; margin:0; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:3px 4px; box-shadow:0 6px 20px rgba(0,0,0,.2)}
.nav .navtabs button{min-height:54px}
.nav .navsell{flex:none; width:86px; min-height:60px; border-radius:22px; border:0; background:var(--accent); color:var(--accent-fg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:12px; font-weight:700; box-shadow:0 6px 20px rgba(0,0,0,.25)}
.nav .navsell svg{width:26px; height:26px; stroke-width:2.4}
body.boot .top,body.boot main,body.boot .nav{visibility:hidden}

.lw{min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; justify-content:center; max-width:420px; margin:0 auto; padding:24px 0}
.lbrand{text-align:center; margin-bottom:26px}
.lbrand img{width:72px; height:72px; border-radius:18px}
.lbrand h1{margin:14px 0 0}
.lt{font-family:var(--font-display); font-size:22px; font-weight:700; letter-spacing:-.02em; margin:0 0 4px; text-transform:none; color:var(--fg)}
.lk{background:none; border:0; color:var(--accent); font-weight:600; font-size:15px; padding:8px 4px; min-height:44px}
.lrow{text-align:center; margin-top:10px; color:var(--muted); font-size:15px}
.lsep{height:1px; background:var(--line); margin:18px 0 8px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<main class="lw"><div class="lbrand"><img src="icon-192.png" alt=""><h1>CRM</h1></div><div id="box"></div></main>
<script>(function(){
'use strict';
var URL_='https://iuqklnlszqmwsseratqb.supabase.co',KEY_='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1cWtsbmxzenFtd3NzZXJhdHFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3MDcxMzUsImV4cCI6MjEwODI4MzEzNX0.VMNTN5BF3XOHT0_LH35Sut0Miffo6KhuvNwmp2ydjxw';
var sb=null,recovering=/type=recovery/.test(location.hash||''),email='',pass='',newp='',busy=false,nome='',wapp='';
try{sb=window.supabase.createClient(URL_,KEY_,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});}catch(e){sb=null;}
function $(s){return document.querySelector(s);}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function authErr(m){m=String(m||'');
  if(/Invalid login/i.test(m))return 'E-mail ou senha incorretos.';
  if(/not confirmed/i.test(m))return 'Confirme seu e-mail antes de entrar.';
  if(/already registered|already been registered/i.test(m))return 'Esse e-mail já tem conta. Use Entrar.';
  if(/at least 6|weak/i.test(m))return 'A senha precisa de pelo menos 6 caracteres.';
  if(/signups? (are )?(not allowed|disabled)/i.test(m))return 'Novos cadastros estão desativados.';
  if(/rate limit/i.test(m))return 'Muitas tentativas. Espere um pouco e tente de novo.';
  if(/fetch|network/i.test(m))return 'Sem conexão. Tente de novo.';
  return m||'Algo deu errado. Tente de novo.';
}
function msg(t,bad){var el=$('#auth-msg');if(el){el.textContent=t||'';el.className='note'+(bad?' neg':'');}}
function go(){location.replace('./');}
var mode=recovering?'recovery':'login',pass2='';
function field(id,label,type,key,val,auto){return '<div class="field"><label for="'+id+'">'+label+'</label><input id="'+id+'" type="'+type+'" '+(type==='email'?'inputmode="email" autocapitalize="none" ':type==='tel'?'inputmode="tel" placeholder="(11) 99999-9999" ':'')+'autocomplete="'+auto+'" data-in="'+key+'" value="'+esc(val)+'"></div>';}
function render(){
  var T={login:'Entrar',signup:'Criar conta',reset:'Recuperar senha',recovery:'Nova senha'}[mode];
  var S_={login:'Entre para ver os seus dados.',signup:'Preencha seus dados para criar a conta.',reset:'Enviaremos um link para o seu e-mail.',recovery:'Defina uma nova senha.'}[mode];
  var h='<h2 class="lt">'+T+'</h2><p class="note" style="margin:0 0 16px">'+S_+'</p>';
  if(mode==='login'){
    h+=field('a-email','E-mail','email','email',email,'email')+field('a-pass','Senha','password','pass',pass,'current-password')+'<p id="auth-msg" class="note"></p>'+
      '<button class="btn primary" data-act="login">Entrar</button>'+
      '<div class="lrow"><button class="lk" data-act="to-reset">Esqueci a senha</button></div>'+
      '<div class="lsep"></div><div class="lrow">Ainda não tem conta? <button class="lk" data-act="to-signup">Criar conta</button></div>';
  }else if(mode==='signup'){
    h+=field('a-nome','Nome','text','nome',nome,'name')+field('a-wapp','WhatsApp','tel','wapp',wapp,'tel')+field('a-email','E-mail','email','email',email,'email')+field('a-pass','Senha (mínimo 6 caracteres)','password','pass',pass,'new-password')+field('a-pass2','Repita a senha','password','pass2',pass2,'new-password')+'<p id="auth-msg" class="note"></p>'+
      '<button class="btn primary" data-act="signup">Criar conta</button>'+
      '<div class="lsep"></div><div class="lrow">Já tem conta? <button class="lk" data-act="to-login">Entrar</button></div>';
  }else if(mode==='reset'){
    h+=field('a-email','E-mail','email','email',email,'email')+'<p id="auth-msg" class="note"></p>'+
      '<button class="btn primary" data-act="reset">Enviar link</button>'+
      '<div class="lsep"></div><div class="lrow"><button class="lk" data-act="to-login">Voltar para entrar</button></div>';
  }else{
    h+=field('a-new','Nova senha','password','new',newp,'new-password')+'<p id="auth-msg" class="note"></p><button class="btn primary" data-act="newpass">Salvar senha</button>';
  }
  $('#box').innerHTML=h;
  if(!sb)msg('Sem conexão com o servidor. Abra com internet.',true);
}
var ACT={
  'to-login':function(){mode='login';render();},
  'to-signup':function(){mode='signup';render();},
  'to-reset':function(){mode='reset';render();},
  login:function(){
    var e=email.trim();
    if(!sb){msg('Sem conexão com o servidor.',true);return;}
    if(!e||!pass){msg('Digite e-mail e senha.',true);return;}
    msg('Entrando…');
    sb.auth.signInWithPassword({email:e,password:pass}).then(function(r){
      if(r.error){msg(authErr(r.error.message),true);return;}
      go();
    },function(){msg('Sem conexão. Tente de novo.',true);});
  },
  signup:function(){
    var e=email.trim(),n=nome.trim(),w=wapp.trim();
    if(!sb){msg('Sem conexão com o servidor.',true);return;}
    if(!n){msg('Digite seu nome.',true);return;}
    if(w.replace(/\D/g,'').length<10){msg('Digite um WhatsApp válido, com DDD.',true);return;}
    if(!e||!pass){msg('Digite e-mail e senha.',true);return;}
    if(pass.length<6){msg('A senha precisa de pelo menos 6 caracteres.',true);return;}
    if(pass!==pass2){msg('As senhas não são iguais.',true);return;}
    msg('Criando conta…');
    sb.auth.signUp({email:e,password:pass,options:{data:{name:n,whatsapp:w},emailRedirectTo:location.origin+location.pathname}}).then(function(r){
      if(r.error){msg(authErr(r.error.message),true);return;}
      if(r.data&&r.data.session){go();}
      else{mode='login';render();msg('Conta criada. Confirme o e-mail que enviamos e depois entre.');}
    },function(){msg('Sem conexão. Tente de novo.',true);});
  },
  reset:function(){
    var e=email.trim();
    if(!sb)return;
    if(!e){msg('Digite seu e-mail.',true);return;}
    sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname}).then(function(r){
      msg(r.error?authErr(r.error.message):'Se esse e-mail tem conta, enviamos um link para redefinir a senha.',!!r.error);
    },function(){msg('Sem conexão. Tente de novo.',true);});
  },
  newpass:function(){
    if(newp.length<6){msg('A senha precisa de pelo menos 6 caracteres.',true);return;}
    sb.auth.updateUser({password:newp}).then(function(r){
      if(r.error){msg(authErr(r.error.message),true);return;}
      go();
    },function(){msg('Sem conexão. Tente de novo.',true);});
  }
};
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-act]');if(b&&ACT[b.dataset.act])ACT[b.dataset.act]();});
document.addEventListener('input',function(e){var k=e.target.dataset&&e.target.dataset.in;if(k==='email')email=e.target.value;else if(k==='pass')pass=e.target.value;else if(k==='pass2')pass2=e.target.value;else if(k==='nome')nome=e.target.value;else if(k==='wapp')wapp=e.target.value;else if(k==='new')newp=e.target.value;});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target&&e.target.tagName==='INPUT'){ACT[{login:'login',signup:'signup',reset:'reset',recovery:'newpass'}[mode]]();}});
if(!sb){render();}
else{
  sb.auth.onAuthStateChange(function(ev){if(ev==='PASSWORD_RECOVERY'){recovering=true;mode='recovery';setTimeout(render,0);}});
  sb.auth.getSession().then(function(r){if(r.data&&r.data.session&&!recovering)go();else render();},function(){render();});
}
})();
</script>
</body>
</html>
